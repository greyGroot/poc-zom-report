<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750" role="img" aria-labelledby="before-title before-desc"><title id="before-title">Before: page controls provide upward navigation</title><desc id="before-desc">Matching focused C4 component views. One shared renderer accepts page-owned ordered items. Only the normal day return anchor retires. Error recovery and adjacent-day controls remain.</desc><defs><marker id="before-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#0f172a}.heading{font-size:21px;font-weight:700}.name{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:13px}.edge{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#before-arrow)}.label{font-size:13px;paint-order:stroke;stroke:#fff;stroke-width:5px}</style><rect width="1100" height="750" fill="#fff"/><text class="heading" x="25" y="32">Before: page controls provide upward navigation</text><rect x="20" y="175" width="1060" height="510" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="2"/><text class="name" x="40" y="202">EE-CRM [Container: Next.js application] · Focused C4 component view</text><rect x="60" y="56" width="320" height="90" rx="9" fill="#fff" stroke="#475569" stroke-width="2"/><text class="name" x="74" y="81">Administrator</text><text class="small" x="74" y="102">[Person]</text><text class="body" x="74" y="128">Reviews teacher schedules and days.</text><rect x="60" y="235" width="320" height="125" rx="9" fill="#fff" stroke="#475569" stroke-width="2"/><text class="name" x="74" y="260">Page clients</text><text class="small" x="74" y="281">[Component: schedule / day / logs]</text><text class="body" x="74" y="307">Own records and existing controls.</text><text class="body" x="74" y="327">Normal day return carries parameters.</text><rect x="450" y="235" width="260" height="125" rx="9" fill="#fff" stroke="#475569" stroke-width="2"/><text class="name" x="464" y="260">Locale context</text><text class="small" x="464" y="281">[Component: shared React context]</text><text class="body" x="464" y="307">Supplies locale and formatUrl.</text><text class="body" x="464" y="327">Owns existing translations.</text><rect x="780" y="235" width="260" height="125" rx="9" fill="#fff" stroke="#475569" stroke-width="2"/><text class="name" x="794" y="260">Existing server data</text><text class="small" x="794" y="281">[Component group: unchanged]</text><text class="body" x="794" y="307">Pages → services → adapters</text><text class="body" x="794" y="327">Supplies authorized records.</text><rect x="450" y="470" width="260" height="115" rx="9" fill="#fff" stroke="#475569" stroke-width="2" stroke-dasharray="7 5"/><text class="name" x="464" y="495">No breadcrumb component</text><text class="small" x="464" y="516">[Absent: comparison space]</text><text class="body" x="464" y="542">Pages use existing controls.</text><rect x="780" y="470" width="260" height="115" rx="9" fill="#fff" stroke="#475569" stroke-width="2"/><text class="name" x="794" y="495">Next.js navigation</text><text class="small" x="794" y="516">[Framework: Link / router]</text><text class="body" x="794" y="542">Opens existing locale routes.</text><text class="body" x="794" y="562">Uses current control destinations.</text><path class="edge" d="M220 146 V235"/><text class="label" x="235" y="168">uses [HTTPS / HTML]</text><path class="edge" d="M380 283 H450"/><text class="label" x="385" y="270">[context]</text><path class="edge" d="M310 360 V400 H910 V360"/><text class="label" x="455" y="391">receives record [RSC props / HTTP]</text><path class="edge" d="M330 360 V435 H910 V470"/><text class="label" x="460" y="427">existing controls [Next Link / href]</text><text class="body" x="60" y="625">Preserve error recovery, previous/next, schedule directory return, filters, auth, lessons, and evidence.</text><text class="body" x="60" y="650">Page-owned paths need no query-retention builder. Any new date formatter stays local to the day client.</text><text class="small" x="25" y="711">Legend: white = existing · blue = page changes (+ INSERT / − RETIRE) · green + ADD = new · dashed = absent</text><text class="small" x="25" y="734">Arrows show caller → dependency. Labels identify responsibilities and interaction protocols.</text></svg>