<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom Attendance Telemetry PoC</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 24px;
      color: #222;
      background: #fafafa;
    }
    h1 {
      margin-bottom: 6px;
      font-size: 1.5rem;
    }
    .controls {
      margin: 16px 0;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: #0d6efd;
      color: white;
      border: 1px solid #0b5ed7;
      border-radius: 4px;
    }
    button.secondary {
      background: #6c757d;
      border-color: #5c636a;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    input[type="date"] {
      padding: 7px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .status-box {
      margin: 14px 0;
      padding: 10px 14px;
      background: #e9ecef;
      border-radius: 4px;
      font-size: 14px;
    }
    .status-box.error {
      background: #f8d7da;
      color: #842029;
      border: 1px solid #f5c2c7;
    }
    .status-box.success {
      background: #d1e7dd;
      color: #0f5132;
      border: 1px solid #badbcc;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      margin-top: 14px;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #dee2e6;
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background-color: #f1f3f5;
      font-weight: 600;
    }
    tr:nth-child(even) {
      background-color: #f8f9fa;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-gray { background: #e2e3e5; color: #41464b; }
    .muted { color: #6c757d; font-size: 12px; }
  </style>
</head>
<body>

  <h1>Zoom Attendance Telemetry PoC</h1>
  <div class="muted">Моніторинг проведених Zoom-уроків мовної школи (Europe/Kyiv)</div>

  <div class="controls">
    <button id="btnToday" type="button">Сьогодні</button>
    <button id="btnYesterday" class="secondary" type="button">Вчора</button>
    <input type="date" id="datePicker">
    <button id="btnLoad" class="secondary" type="button">Показати</button>
  </div>

  <div id="statusMessage" class="status-box">Завантаження...</div>

  <table id="resultsTable" style="display: none;">
    <thead>
      <tr>
        <th style="width: 40px;">#</th>
        <th>Викладач (Ім'я / Email)</th>
        <th>Тема та ID зустрічі</th>
        <th>Початок (Київ) та тривалість</th>
        <th>К-сть учасників</th>
        <th>Список учасників (Participants)</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    const btnToday = document.getElementById('btnToday');
    const btnYesterday = document.getElementById('btnYesterday');
    const datePicker = document.getElementById('datePicker');
    const btnLoad = document.getElementById('btnLoad');
    const statusMsg = document.getElementById('statusMessage');
    const resultsTable = document.getElementById('resultsTable');
    const tableBody = document.getElementById('tableBody');

    // Calculate date YYYY-MM-DD in Europe/Kyiv timezone with optional offset
    function getKyivDateString(dayOffset = 0) {
      const now = new Date();
      now.setDate(now.getDate() + dayOffset);
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Europe/Kyiv',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).format(now);
    }

    async function loadReport(date) {
      datePicker.value = date;
      statusMsg.className = 'status-box';
      statusMsg.textContent = `Завантаження даних за ${date}...`;
      resultsTable.style.display = 'none';
      tableBody.innerHTML = '';

      btnToday.disabled = true;
      btnYesterday.disabled = true;
      btnLoad.disabled = true;

      try {
        const response = await fetch(`/api/report?date=${encodeURIComponent(date)}`);
        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `Помилка сервера HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!Array.isArray(data) || data.length === 0) {
          statusMsg.className = 'status-box';
          statusMsg.textContent = `Зустрічей не знайдено за ${date}.`;
          return;
        }

        statusMsg.className = 'status-box success';
        statusMsg.textContent = `За ${date} знайдено зустрічей: ${data.length}`;

        data.forEach((item, index) => {
          const tr = document.createElement('tr');

          // Participants formatting
          let participantsHtml = '<span class="muted">—</span>';
          if (item.participants && item.participants.length > 0) {
            participantsHtml = item.participants.map(name => `<div>• ${escapeHtml(name)}</div>`).join('');
          } else if (item.participantsCount > 0) {
            participantsHtml = `<span class="muted">${item.participantsCount} учасник(ів)</span>`;
          }

          tr.innerHTML = `
            <td>${index + 1}</td>
            <td>
              <strong>${escapeHtml(item.teacher || 'Невідомий')}</strong>
              <div class="muted">${escapeHtml(item.teacherEmail || '')}</div>
            </td>
            <td>
              <strong>${escapeHtml(item.topic || 'Без назви')}</strong>
              <div class="muted">ID: ${escapeHtml(String(item.meetingId || ''))}</div>
            </td>
            <td>
              <div>${item.startTimeKyiv ? item.startTimeKyiv : ''}</div>
              <div class="muted">${item.duration} хв</div>
            </td>
            <td>
              <strong>${item.participantsCount}</strong>
            </td>
            <td>${participantsHtml}</td>
          `;
          tableBody.appendChild(tr);
        });

        resultsTable.style.display = 'table';
      } catch (err) {
        statusMsg.className = 'status-box error';
        statusMsg.textContent = `Помилка завантаження: ${err.message}`;
      } finally {
        btnToday.disabled = false;
        btnYesterday.disabled = false;
        btnLoad.disabled = false;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    btnToday.addEventListener('click', () => loadReport(getKyivDateString(0)));
    btnYesterday.addEventListener('click', () => loadReport(getKyivDateString(-1)));
    btnLoad.addEventListener('click', () => {
      if (datePicker.value) {
        loadReport(datePicker.value);
      }
    });

    // Initial load: today
    const todayStr = getKyivDateString(0);
    datePicker.value = todayStr;
    loadReport(todayStr);
  </script>
</body>
</html>
